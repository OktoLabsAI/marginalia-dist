  bash-forwarder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Verify predecessor pre-status cleanup
        run: |
          set -euo pipefail
          TEST_ROOT="$(mktemp -d)"
          MIGRATION_HOME="/tmp/marginalia-predecessor-migration"
          UNRELATED_PID=""
          cleanup() {
            if [ -f "$MIGRATION_HOME/predecessor-owned.pid" ]; then
              kill "$(cat "$MIGRATION_HOME/predecessor-owned.pid")" >/dev/null 2>&1 || true
            fi
            if [ -n "$UNRELATED_PID" ]; then
              kill "$UNRELATED_PID" >/dev/null 2>&1 || true
              wait "$UNRELATED_PID" 2>/dev/null || true
            fi
            rm -rf "$TEST_ROOT" "$MIGRATION_HOME"
          }
          trap cleanup EXIT
          rm -rf "$MIGRATION_HOME"

          sleep 300 &
          UNRELATED_PID=$!
          export UNRELATED_PID
          cat > "$TEST_ROOT/predecessor-install.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          legacy_root="$HOME/.marginalia/vaults/legacy-vault/.marginalia"
          app_root="$HOME/.marginalia/runtime/.marginalia"
          mkdir -p "$legacy_root" "$app_root" "$HOME/.local/bin"
          cp "$(command -v sleep)" "$HOME/predecessor-owned"
          nohup "$HOME/predecessor-owned" 300 >/dev/null 2>&1 &
          owned_pid=$!
          printf '%s\n' "$owned_pid" > "$HOME/predecessor-owned.pid"
          printf '{"version":1,"pid":%s,"start_token":"owned","owner_id":"0123456789abcdef0123456789abcdef"}\n' \
            "$owned_pid" > "$legacy_root/server.pid"
          printf '{"version":1,"pid":%s,"start_token":"unowned","owner_id":"fedcba9876543210fedcba9876543210"}\n' \
            "$UNRELATED_PID" > "$app_root/server.pid"
          cat > "$HOME/.local/bin/marginalia" <<'CLI'
          #!/usr/bin/env bash
          set -euo pipefail
          printf '%s\n' "$*" >> "$HOME/predecessor-cleanup.calls"
          case "$*" in
            "stop --vault "*)
              record="$HOME/.marginalia/vaults/legacy-vault/.marginalia/server.pid"
              pid="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["pid"])' "$record")"
              kill "$pid" >/dev/null 2>&1 || true
              for _ in $(seq 1 100); do
                kill -0 "$pid" >/dev/null 2>&1 || break
                sleep 0.02
              done
              kill -KILL "$pid" >/dev/null 2>&1 || true
              rm -f "$record"
              ;;
          esac
          CLI
          chmod +x "$HOME/.local/bin/marginalia"
          SH
          chmod +x "$TEST_ROOT/predecessor-install.sh"
          printf '{}\n' > "$TEST_ROOT/predecessor-manifest.json"
          export PREDECESSOR_FIXTURE_ROOT="$TEST_ROOT"

          curl() {
            local url="" output=""
            while [ "$#" -gt 0 ]; do
              case "$1" in
                -o) output="$2"; shift 2 ;;
                -*) shift ;;
                *) url="$1"; shift ;;
              esac
            done
            case "$url" in
              */install.sh) cp "$PREDECESSOR_FIXTURE_ROOT/predecessor-install.sh" "$output" ;;
              */release-manifest.json) cp "$PREDECESSOR_FIXTURE_ROOT/predecessor-manifest.json" "$output" ;;
              *) return 64 ;;
            esac
          }
          sha256sum() {
            case "$1" in
              */predecessor-install.sh)
                printf '55127f6a3ef35e7b0ae9bc0aeb506dc3c51b6695d9dfb759f73dd018b8870866  %s\n' "$1"
                ;;
              */predecessor-manifest.json)
                printf '619d45919b506757442b758a4898e865e5600c7da12d8c83677bb3080414c5d8  %s\n' "$1"
                ;;
              *) command sha256sum "$@" ;;
            esac
          }
          export -f curl sha256sum

          sed -n \
            '/^run_predecessor_migration() (/ , /^run_release_lifecycle() {/p' \
            test-install.sh | sed '$d' > "$TEST_ROOT/predecessor-function.sh"
          grep -Fq 'run_predecessor_migration() (' "$TEST_ROOT/predecessor-function.sh"

          set +e
          (
            export MARGINALIA_TEST_FAIL_PREDECESSOR_BEFORE_STATUS=1
            export EXPECTED_VERSION="0.0.test"
            export MANIFEST_URL="https://invalid.example/successor-manifest.json"
            # shellcheck source=/dev/null
            source "$TEST_ROOT/predecessor-function.sh"
            run_predecessor_migration
          ) > "$TEST_ROOT/output.log" 2>&1
          result=$?
          set -e
          test "$result" -ne 0
          grep -Fq 'forced predecessor failure before status' "$TEST_ROOT/output.log"
          owned_pid="$(cat "$MIGRATION_HOME/predecessor-owned.pid")"
          for _ in $(seq 1 100); do
            kill -0 "$owned_pid" >/dev/null 2>&1 || break
            sleep 0.02
          done
          if kill -0 "$owned_pid" >/dev/null 2>&1; then
            echo "predecessor-owned daemon survived pre-status failure cleanup" >&2
            exit 1
          fi
          kill -0 "$UNRELATED_PID"
          grep -Fxq 'stop --timeout 10' "$MIGRATION_HOME/predecessor-cleanup.calls"
          grep -Fxq \
            "stop --vault $MIGRATION_HOME/.marginalia/vaults/legacy-vault --timeout 10" \
            "$MIGRATION_HOME/predecessor-cleanup.calls"
          printf 'BASH_PREDECESSOR_PRE_STATUS_CLEANUP_OK owned=%s unrelated=%s\n' \
            "$owned_pid" "$UNRELATED_PID"

      - name: Verify forwarder failure paths and pass-through
        run: |
          set -euo pipefail
          TEST_ROOT="$(mktemp -d)"
          trap 'rm -rf "$TEST_ROOT"' EXIT
          SHIM="$TEST_ROOT/shim"
          export FORWARD_TMP="$TEST_ROOT/tmp"
          mkdir -p "$SHIM" "$FORWARD_TMP"
          # A curl stand-in whose behaviour is picked per case by CURL_MODE.
          cat > "$SHIM/curl" <<'SH'
          #!/usr/bin/env bash
          output=""
          while [ "$#" -gt 0 ]; do
            case "$1" in
              -o) output="$2"; shift 2 ;;
              *) shift ;;
            esac
          done
          case "$CURL_MODE" in
            fail) exit 22 ;;
            html) printf '<html>not a script</html>\n' > "$output" ;;
            fixture)
              {
                printf '%s\n' '#!/usr/bin/env bash'
                printf '%s\n' '# Okto Neuron one-shot installer (gate fixture)'
                printf '%s\n' 'printf "FIXTURE_ARGS=%s\n" "$*"'
                printf '%s\n' 'printf "FIXTURE_NO_SERVE=%s\n" "${MARGINALIA_NO_SERVE:-}"'
                printf '%s\n' 'IFS= read -r leftover || true'
                printf '%s\n' 'printf "FIXTURE_STDIN=%s\n" "${leftover:-<eof>}"'
                printf '%s\n' 'exit "${FIXTURE_STATUS:-0}"'
              } > "$output"
              ;;
          esac
          SH
          chmod +x "$SHIM/curl"
          run_forwarder() {
            PATH="$SHIM:$PATH" TMPDIR="$FORWARD_TMP" bash "$@"
          }

          if CURL_MODE=fail run_forwarder install.sh >"$TEST_ROOT/fail.out" 2>&1; then
            echo "forwarder succeeded although the download failed" >&2
            exit 1
          fi
          grep -Fq 'Marginalia is now Okto Neuron; forwarding to the Okto Neuron installer' "$TEST_ROOT/fail.out"
          grep -Fq 'could not download the Okto Neuron installer' "$TEST_ROOT/fail.out"

          if CURL_MODE=html run_forwarder install.sh >"$TEST_ROOT/html.out" 2>&1; then
            echo "forwarder ran a download that is not the installer" >&2
            exit 1
          fi
          grep -Fq 'is not the Okto Neuron installer; refusing to run it' "$TEST_ROOT/html.out"

          # Arguments and MARGINALIA_* variables reach the child unchanged, and
          # under the piped form the child never reads the forwarder's own bytes.
          CURL_MODE=fixture MARGINALIA_NO_SERVE=1 \
            run_forwarder -s -- --no-onboard < <(cat install.sh) >"$TEST_ROOT/pass.out" 2>&1
          grep -Fxq 'FIXTURE_ARGS=--no-onboard' "$TEST_ROOT/pass.out"
          grep -Fxq 'FIXTURE_NO_SERVE=1' "$TEST_ROOT/pass.out"
          grep -Fxq 'FIXTURE_STDIN=<eof>' "$TEST_ROOT/pass.out"

          set +e
          CURL_MODE=fixture FIXTURE_STATUS=7 run_forwarder install.sh >"$TEST_ROOT/status.out" 2>&1
          status=$?
          set -e
          test "$status" -eq 7
          grep -Fq 'the Okto Neuron installer exited with status 7' "$TEST_ROOT/status.out"

          # Every case removed its downloaded copy.
          test -z "$(find "$FORWARD_TMP" -mindepth 1 -print -quit)"
          echo "FORWARDER_FAILURE_PATHS_OK"

      - name: Forward to the real Okto Neuron installer
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/forward-home"
          mkdir -p "$HOME"
          OUT="$RUNNER_TEMP/forward-preseed.out"
          if MARGINALIA_LLM_PROVIDER=skip bash install.sh >"$OUT" 2>&1; then
            echo "forwarded installer accepted a provider preseed without a vault" >&2
            exit 1
          fi
          cat "$OUT"
          grep -Fq 'MARGINALIA_LLM_PROVIDER is deprecated; using it as OKTO_NEURON_LLM_PROVIDER' "$OUT"
          grep -Fq 'OKTO_NEURON_LLM_PROVIDER requires OKTO_NEURON_VAULT' "$OUT"

          # The documented one-liner shape: the script arrives on stdin.
          MARGINALIA_NO_SERVE=1 MARGINALIA_NO_MCP=1 MARGINALIA_NO_UPDATE_SHELL=1 \
            bash -s -- --no-onboard < <(cat install.sh)
          export PATH="$HOME/.local/bin:$PATH"
          VERSION_OUT="$(okto-neuron --version)"
          printf '%s\n' "$VERSION_OUT"
          grep -Fq '0.3.0' <<<"$VERSION_OUT"
          grep -Fq 'Okto Neuron by Okto Labs' <<<"$VERSION_OUT"
          echo "FORWARDER_OKTO_NEURON_INSTALL_OK"

  powershell-forwarder:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Parse PowerShell scripts
        shell: powershell
        run: |
          $failed = $false
          foreach ($path in @("install.ps1", "test-install.ps1")) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $path),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-Host
              $failed = $true
            }
          }

          $tester = Get-Content -Raw -LiteralPath "test-install.ps1"
          $childMatch = [regex]::Match(
            $tester,
            '(?s)\$child = @''\r?\n(?<child>.*?)\r?\n''@'
          )
          if (-not $childMatch.Success) {
            throw "test-install.ps1 child runner here-string was not found"
          }
          $childTokens = $null
          $childErrors = $null
          $childAst = [System.Management.Automation.Language.Parser]::ParseInput(
            $childMatch.Groups["child"].Value,
            [ref]$childTokens,
            [ref]$childErrors
          )
          if ($childErrors.Count -gt 0) {
            $childErrors | Format-List | Out-Host
            throw "generated Windows child runner did not parse"
          }
          $lifecycleAst = $childAst.Find(
            {
              param($node)
              $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and
                $node.Name -eq "Invoke-ReleaseLifecycle"
            },
            $true
          )
          if ($null -eq $lifecycleAst) {
            throw "generated Windows child runner has no Invoke-ReleaseLifecycle function"
          }
          $previousMarkerIndex = -1
          foreach ($marker in @(
            "WINDOWS_RELEASE_LIFECYCLE_PREDECESSOR_STOPPED_UPDATE_OK",
            "WINDOWS_RELEASE_LIFECYCLE_APP_FIRST_OK",
            "RELEASE_LIFECYCLE_FRESH_INSTALL_OK",
            "RELEASE_LIFECYCLE_STATUS_UI_OK",
            "RELEASE_LIFECYCLE_STOPPED_UPDATE_OK",
            "RELEASE_LIFECYCLE_RUNNING_UPDATE_OK",
            "RELEASE_LIFECYCLE_CUSTOM_PORT_REFUSAL_OK",
            "RELEASE_LIFECYCLE_LIVE_PID_REFUSAL_OK",
            "RELEASE_LIFECYCLE_PREVIOUS_TOOL_SENTINEL_SHA256=",
            "RELEASE_LIFECYCLE_PREVIOUS_TOOL_SENTINEL_OK",
            "RELEASE_LIFECYCLE_ACTIVATION_ROLLBACK_OK",
            "RELEASE_LIFECYCLE_FINAL_STOP_OK",
            "WINDOWS_RELEASE_LIFECYCLE_OK"
          )) {
            $matches = [regex]::Matches($tester, [regex]::Escape($marker))
            if ($matches.Count -ne 1) {
              throw "Windows lifecycle marker is missing or duplicated: $marker"
            }
            if ($matches[0].Index -le $previousMarkerIndex) {
              throw "Windows lifecycle markers are out of order at: $marker"
            }
            $previousMarkerIndex = $matches[0].Index
          }
          foreach ($required in @(
            '92bebfac1347d60a84281e3ca4692565fd954ffe',
            '01e47fd5ffdf5f68abfd30834f6bc5ff7c448784bfa70bc175e44351ef8d62b2',
            '6842a55fe5e1180c67e81035342ee8b300f5ff2ce2aafbe48129d709a76dbfa6',
            'Invoke-StoppedPredecessorUpdate $InstallUrl $ExpectedVersion $ManifestUrl $TestHome',
            'PREDECESSOR_BOOTSTRAP_MODE=successor-installer-with-immutable-stopped-v0.0.41-wheel',
            'WINDOWS_RELEASE_LIFECYCLE_PREDECESSOR_STOPPED_UPDATE_OK',
            '$predecessorHome = Join-Path $HomePath "stopped-predecessor"',
            '$env:MARGINALIA_DEFAULT_WHEEL_URL = $predecessorWheelUrl',
            '$env:MARGINALIA_DEFAULT_WHEEL_URL = $successorWheelUrl',
            'Invoke-RawInstallerProcess $Url $predecessorOutput',
            'Invoke-RawInstallerProcess $Url $successorOutput',
            'Get-Content -Raw -LiteralPath $source | Invoke-Expression',
            '.release-lifecycle-previous-tool-sentinel',
            'RELEASE_LIFECYCLE_PREVIOUS_TOOL_SENTINEL_SHA256=',
            '$Profile -in @("interactive", "release-lifecycle")',
            'if ($Profile -eq "skip")',
            '$env:UV_NO_MODIFY_PATH = "1"',
            '$env:UV_PYTHON_NO_REGISTRY = "1"',
            '$env:UV_PYTHON_INSTALL_REGISTRY = "0"',
            '$env:UV_INSTALL_DIR = Join-Path $TestHome ".uv\bin"',
            '$env:UV_PYTHON_BIN_DIR = Join-Path $TestHome ".uv\python-bin"',
            '$env:UV_PYTHON_CACHE_DIR = Join-Path $TestHome ".uv\python-cache"',
            '$env:XDG_BIN_HOME = Join-Path $TestHome ".local\bin"',
            '$env:MARGINALIA_MANIFEST = $ManifestUrl',
            'Remove-Item Env:MARGINALIA_VAULT -ErrorAction SilentlyContinue',
            'Export-PublicEvidence',
            'Initialize-TestSandbox',
            '"marginalia-install-test-" + [guid]::NewGuid().ToString("N").Substring(0, 12)',
            '$oldErrorActionPreference = $ErrorActionPreference',
            '$ErrorActionPreference = "Continue"',
            'Invoke-ReleaseLifecycle $sandboxCli'
          )) {
            if (-not $tester.Contains($required)) {
              throw "Windows release lifecycle contract is missing: $required"
            }
          }
          $sentinelCreateIndex = $tester.IndexOf('-Value "previous-tool-only:$Version"')
          $customRefusalIndex = $tester.IndexOf('RELEASE_LIFECYCLE_CUSTOM_PORT_REFUSAL_OK')
          $livePidRefusalIndex = $tester.IndexOf('RELEASE_LIFECYCLE_LIVE_PID_REFUSAL_OK')
          $sentinelPathChecks = [regex]::Matches(
            $tester,
            [regex]::Escape('-LiteralPath $rollbackSentinel')
          ).Count
          if ($sentinelCreateIndex -lt 0 -or
              $sentinelCreateIndex -ge $customRefusalIndex -or
              $sentinelCreateIndex -ge $livePidRefusalIndex -or
              $sentinelPathChecks -lt 4) {
            throw "Windows same-version refusal sentinel contract is incomplete"
          }
          $nativeProbe = ([string](& python -c 'print(''WINDOWS_NATIVE_ARG_OK'')')).Trim()
          if ($LASTEXITCODE -ne 0 -or $nativeProbe -ne "WINDOWS_NATIVE_ARG_OK") {
            throw "Windows native Python argument probe failed"
          }
          if ($failed) { throw "PowerShell syntax validation failed" }

      - name: Forward to the real Okto Neuron installer
        shell: powershell
        run: |
          $forwarder = Join-Path $PWD "install.ps1"
          $runner = Join-Path $env:RUNNER_TEMP "run-forwarder.ps1"
          Set-Content -LiteralPath $runner -Value "Get-Content -Raw -LiteralPath '$forwarder' | Invoke-Expression"

          $env:MARGINALIA_LLM_PROVIDER = "skip"
          $preseedOut = Join-Path $env:RUNNER_TEMP "forward-preseed.out"
          & powershell -NoProfile -ExecutionPolicy Bypass -File $runner *> $preseedOut
          $preseedCode = $LASTEXITCODE
          Remove-Item Env:MARGINALIA_LLM_PROVIDER
          $preseed = Get-Content -Raw -LiteralPath $preseedOut
          $preseed | Out-Host
          # Only the refusal and the forwarded env are asserted here: the Okto Neuron
          # install.ps1 0.3.0 early-exit path does not print its own error text.
          if ($preseedCode -eq 0) { throw "forwarded installer accepted a provider preseed without a vault" }
          foreach ($needle in @(
            "Marginalia is now Okto Neuron; forwarding to the Okto Neuron installer",
            "MARGINALIA_LLM_PROVIDER is deprecated; using it as OKTO_NEURON_LLM_PROVIDER"
          )) {
            if (-not $preseed.Contains($needle)) { throw "missing from forwarded output: $needle" }
          }

          $env:MARGINALIA_NO_SERVE = "1"
          $env:MARGINALIA_NO_MCP = "1"
          $env:MARGINALIA_NO_OPEN = "1"
          $env:MARGINALIA_NO_UPDATE_SHELL = "1"
          & powershell -NoProfile -ExecutionPolicy Bypass -File $runner
          if ($LASTEXITCODE -ne 0) { throw "forwarded Okto Neuron install failed with exit code $LASTEXITCODE" }
          $cli = Join-Path $HOME ".local\bin\okto-neuron.exe"
          if (-not (Test-Path -LiteralPath $cli)) { throw "okto-neuron.exe not found at $cli" }
          $versionOut = (& $cli --version | Out-String)
          $versionOut | Out-Host
          if (-not $versionOut.Contains("0.3.0") -or -not $versionOut.Contains("Okto Neuron by Okto Labs")) {
            throw "okto-neuron --version did not report 0.3.0 by Okto Labs"
          }
          "WINDOWS_FORWARDER_OKTO_NEURON_INSTALL_OK"
